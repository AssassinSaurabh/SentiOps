# ─────────────────────────────────────────────────────────────
# nginx/nginx.conf
# Purpose: Reverse proxy to FastAPI
# ─────────────────────────────────────────────────────────────

# How many worker processes to run
# auto = one worker per CPU core (optimal for performance)
worker_processes auto;

# Error log location and level
error_log /var/log/nginx/error.log warn;
# warn level = show warnings and above (error, crit, alert, emerg)
# In production: change 'warn' to 'error' to reduce log noise

# PID file: stores the Nginx process ID
pid /var/run/nginx.pid;

# Maximum number of connections per worker
events {
    worker_connections 1024;
    # 1024 connections per worker × auto workers = total connections
}

http {
    # ── Basic Settings ──
    include       /etc/nginx/mime.types;
    # mime.types = file that maps file extensions to content types
    # .html → text/html, .json → application/json, etc.
    
    default_type application/octet-stream;
    # If file type is unknown, send as raw binary
    
    # ── Logging Format ──
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    # Custom log format. Variables:
    # $remote_addr    = client IP address
    # $time_local     = request time
    # $request        = "GET /health HTTP/1.1"
    # $status         = HTTP status code (200, 404, 500...)
    # $body_bytes_sent = response size in bytes
    
    access_log /var/log/nginx/access.log main;
    # Where to write access logs (every request)
    
    # ── Performance ──
    sendfile on;
    # sendfile = use kernel-level file sending (faster for static files)
    
    keepalive_timeout 65;
    # Keep connections open for 65 seconds (reuse for multiple requests)
    # Reduces TCP handshake overhead
    
    # ── Security Headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Prevent clickjacking: don't allow this site in an iframe from other domains
    
    add_header X-Content-Type-Options "nosniff" always;
    # Prevent MIME sniffing: browser must use declared content type
    
    add_header X-XSS-Protection "1; mode=block" always;
    # Enable browser's XSS filter
    
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Control how much referrer info is sent with requests
    
    server_tokens off;
    # Don't reveal Nginx version in error pages or headers
    # Attackers use version info to find known vulnerabilities
    
    # ── Gzip Compression ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    # Compress JSON responses (our API responses) and text
    # Reduces bandwidth by 60-80%
    gzip_min_length 1000;
    # Only compress responses larger than 1000 bytes (compression overhead not worth it for small responses)
    
    # ── Rate Limiting ──
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    # Create a rate limiting zone called "api"
    # $binary_remote_addr = track by client IP address
    # zone=api:10m = store state in 10MB of shared memory
    # rate=30r/s = allow 30 requests per second per IP
    # 10MB can track ~160,000 IP addresses
    
    # ── Upstream (backend server definition) ──
    upstream fastapi_backend {
        # 'fastapi' = Docker service name (works inside Docker network)
        # Port 8000 = FastAPI's internal port
        server fastapi:8000;
        
        # In production with multiple FastAPI instances:
        # server fastapi1:8000;
        # server fastapi2:8000;
        # server fastapi3:8000;
        # Nginx would load balance between them automatically
        
        keepalive 32;
        # Keep 32 connections open to FastAPI (reuse, don't reconnect)
    }
    
    # ── Server Block (Virtual Host) ──
    server {
        listen 80;
        # Listen on port 80 (HTTP)
        
        server_name _;
        # _ = match any hostname (catch-all)
        # In production: server_name sentinelops.yourcompany.com;
        
        # ── API Proxy ──
        location /api/ {
            # All requests starting with /api/ go to FastAPI
            
            limit_req zone=api burst=20 nodelay;
            # Apply rate limiting
            # burst=20 = allow 20 extra requests in a burst
            # nodelay = process burst immediately (don't queue/delay)
            
            proxy_pass http://fastapi_backend;
            # Forward request to our upstream FastAPI server
            
            proxy_set_header Host $host;
            # Tell FastAPI which hostname was requested
            
            proxy_set_header X-Real-IP $remote_addr;
            # Tell FastAPI the REAL client IP (not Nginx's IP)
            # Without this: FastAPI sees all requests from 172.x.x.x (Docker IP)
            
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Standard header for passing client IP through proxies
            
            proxy_set_header X-Forwarded-Proto $scheme;
            # Tell FastAPI if original request was http or https
            
            proxy_connect_timeout 10s;
            # Give up connecting to FastAPI after 10 seconds
            
            proxy_read_timeout 60s;
            # Give FastAPI up to 60 seconds to respond
            # LLM endpoints might need more (we'll increase for those)
            
            proxy_buffering off;
            # Don't buffer responses (important for streaming/real-time)
        }
        
        # ── Health Check (no rate limiting) ──
        location /health {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
            # Don't log health check requests (would spam logs)
        }
        
        # ── Root ──
        location / {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
